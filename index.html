<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transcription Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        
        /* Pulse Animation for Recording */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .recording-pulse::before {
            content: '';
            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background-color: #ef4444;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-8">

    <main class="max-w-4xl w-full mx-auto flex-1 flex flex-col gap-6">
        <!-- Header -->
        <header class="text-center mb-4">
            <h1 class="text-3xl font-bold text-white mb-2"><i class="fa-solid fa-microphone-lines text-cyan-400 mr-3"></i>Trợ Lý Nhận Dạng & Ghi Âm</h1>
            <p class="text-slate-400">Chuyển đổi giọng nói thành văn bản thời gian thực và ghi lại âm thanh gốc.</p>
        </header>

        <!-- Controls -->
        <div class="bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700 flex flex-col sm:flex-row items-center gap-6 justify-between z-10 relative">
            
            <!-- Language Selector -->
            <div class="w-full sm:w-auto flex flex-col gap-2">
                <label for="langSelect" class="text-sm font-medium text-slate-400">Chọn Ngôn Ngữ</label>
                <select id="langSelect" class="bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500 w-full sm:w-64 appearance-none cursor-pointer">
                    <option value="vi-VN" selected>🇻🇳 Tiếng Việt (Vietnamese)</option>
                    <option value="en-US">🇺🇸 Tiếng Anh (English - US)</option>
                    <option value="zh-CN">🇨🇳 Tiếng Trung (Chinese - PRC)</option>
                </select>
            </div>

            <!-- Record Button -->
            <div class="flex flex-col items-center gap-2">
                <button id="recordBtn" class="relative w-20 h-20 rounded-full bg-slate-700 hover:bg-slate-600 text-white shadow-lg transition-all duration-300 flex items-center justify-center text-3xl focus:outline-none">
                    <i id="recordIcon" class="fa-solid fa-microphone"></i>
                </button>
                <span id="recordStatus" class="text-sm font-medium text-slate-400">Nhấn để bắt đầu</span>
            </div>
            
            <!-- Clear Button -->
            <div class="w-full sm:w-auto flex justify-center sm:justify-end">
                <button id="clearBtn" class="text-slate-400 hover:text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-trash-can"></i> Xóa phiên
                </button>
            </div>
        </div>

        <!-- Transcription Area -->
        <div class="flex-1 bg-slate-900 rounded-2xl border border-slate-700 shadow-xl overflow-hidden flex flex-col min-h-[300px]">
            <div class="bg-slate-800/50 px-4 py-3 border-b border-slate-700 flex justify-between items-center">
                <span class="font-medium text-slate-300"><i class="fa-solid fa-align-left mr-2"></i>Văn bản nhận dạng</span>
                <span id="statusIndicator" class="text-xs font-semibold px-2 py-1 rounded bg-slate-700 text-slate-300">Đang chờ...</span>
            </div>
            <div class="flex-1 p-6 flex flex-col relative">
                <!-- Text that has been confirmed -->
                <div id="finalText" class="text-lg text-white whitespace-pre-wrap flex-1 mb-2"></div>
                <!-- Text currently being spoken (interim) -->
                <div id="interimText" class="text-lg text-cyan-400 italic"></div>
                
                <!-- Empty state placeholder -->
                <div id="placeholderText" class="absolute inset-0 flex items-center justify-center text-slate-500 pointer-events-none">
                    Văn bản sẽ xuất hiện tại đây khi bạn nói...
                </div>
            </div>
        </div>

        <!-- Audio Playback Area (Hidden initially) -->
        <div id="audioPlayerContainer" class="hidden bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">
            <h3 class="text-sm font-medium text-slate-300 mb-4 flex items-center"><i class="fa-solid fa-headphones mr-2 text-cyan-400"></i>Bản ghi âm gốc của bạn</h3>
            <audio id="audioPlayback" controls class="w-full h-12 rounded-lg focus:outline-none"></audio>
            <div class="mt-3 flex justify-between items-center text-xs text-slate-400">
                <span>Bạn có thể phát lại để kiểm tra âm thanh gốc.</span>
                <a id="downloadAudioBtn" href="#" download="recording.webm" class="text-cyan-400 hover:text-cyan-300 hidden">
                    <i class="fa-solid fa-download mr-1"></i> Tải file .webm
                </a>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // UI Elements
            const langSelect = document.getElementById('langSelect');
            const recordBtn = document.getElementById('recordBtn');
            const recordIcon = document.getElementById('recordIcon');
            const recordStatus = document.getElementById('recordStatus');
            const statusIndicator = document.getElementById('statusIndicator');
            const finalTextContainer = document.getElementById('finalText');
            const interimTextContainer = document.getElementById('interimText');
            const placeholderText = document.getElementById('placeholderText');
            const clearBtn = document.getElementById('clearBtn');
            
            const audioPlayerContainer = document.getElementById('audioPlayerContainer');
            const audioPlayback = document.getElementById('audioPlayback');
            const downloadAudioBtn = document.getElementById('downloadAudioBtn');

            // State
            let isRecording = false;
            let finalTranscript = '';
            
            // Web Speech API
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = null;

            // Web Audio API / MediaRecorder
            let mediaRecorder = null;
            let audioChunks = [];
            let mediaStream = null;

            // Initialize Speech Recognition
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true; // Keep listening
                recognition.interimResults = true; // Show results while speaking

                recognition.onstart = () => {
                    statusIndicator.textContent = 'Đang nghe...';
                    statusIndicator.className = 'text-xs font-semibold px-2 py-1 rounded bg-red-900/50 text-red-400 border border-red-800';
                };

                recognition.onresult = (event) => {
                    placeholderText.style.display = 'none';
                    let interimTranscript = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            finalTranscript += transcript + ' ';
                        } else {
                            interimTranscript += transcript;
                        }
                    }

                    finalTextContainer.textContent = finalTranscript;
                    interimTextContainer.textContent = interimTranscript;
                };

                recognition.onerror = (event) => {
                    console.error('Speech Recognition Error:', event.error);
                    if (event.error === 'not-allowed') {
                        alert('Trình duyệt chưa được cấp quyền sử dụng Micro. Vui lòng cho phép!');
                        stopAll();
                    }
                };

                recognition.onend = () => {
                    // Auto-restart if it stops but user didn't click stop (Webkit bug handling)
                    if (isRecording) {
                        try {
                            recognition.start();
                        } catch (e) {
                            console.error(e);
                        }
                    }
                };
            } else {
                alert('Trình duyệt của bạn không hỗ trợ Web Speech API. Vui lòng sử dụng Google Chrome hoặc Edge.');
                recordBtn.disabled = true;
                recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            async function startAll() {
                // Clear previous audio
                audioPlayerContainer.classList.add('hidden');
                audioChunks = [];
                if (audioPlayback.src) {
                    URL.revokeObjectURL(audioPlayback.src);
                    audioPlayback.src = '';
                }

                try {
                    // 1. Request Microphone access for MediaRecorder
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    // 2. Setup MediaRecorder
                    mediaRecorder = new MediaRecorder(mediaStream);
                    
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        // Create playable audio blob
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        
                        audioPlayback.src = audioUrl;
                        audioPlayerContainer.classList.remove('hidden');
                        
                        downloadAudioBtn.href = audioUrl;
                        downloadAudioBtn.classList.remove('hidden');

                        // Stop microphone tracks completely to remove red dot on tab
                        if (mediaStream) {
                            mediaStream.getTracks().forEach(track => track.stop());
                        }
                    };

                    // 3. Start Both
                    recognition.lang = langSelect.value;
                    mediaRecorder.start();
                    recognition.start();

                    // Update UI
                    isRecording = true;
                    recordBtn.classList.remove('bg-slate-700', 'hover:bg-slate-600');
                    recordBtn.classList.add('bg-red-500', 'hover:bg-red-400', 'recording-pulse');
                    recordIcon.classList.remove('fa-microphone');
                    recordIcon.classList.add('fa-stop');
                    recordStatus.textContent = 'Đang ghi âm (Nhấn để dừng)';
                    recordStatus.classList.add('text-red-400');
                    langSelect.disabled = true;
                    langSelect.classList.add('opacity-50', 'cursor-not-allowed');

                } catch (err) {
                    console.error('Lỗi khi truy cập micro:', err);
                    alert('Không thể truy cập Micro để ghi âm gốc. Lỗi: ' + err.message);
                }
            }

            function stopAll() {
                isRecording = false;
                
                // Stop Speech Recognition
                if (recognition) recognition.stop();
                
                // Stop Media Recorder
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }

                // Update UI
                recordBtn.classList.remove('bg-red-500', 'hover:bg-red-400', 'recording-pulse');
                recordBtn.classList.add('bg-slate-700', 'hover:bg-slate-600');
                recordIcon.classList.remove('fa-stop');
                recordIcon.classList.add('fa-microphone');
                recordStatus.textContent = 'Nhấn để bắt đầu';
                recordStatus.classList.remove('text-red-400');
                langSelect.disabled = false;
                langSelect.classList.remove('opacity-50', 'cursor-not-allowed');
                
                statusIndicator.textContent = 'Đã dừng';
                statusIndicator.className = 'text-xs font-semibold px-2 py-1 rounded bg-slate-700 text-slate-300';
                interimTextContainer.textContent = ''; // Clear interim text
            }

            // Toggle Recording
            recordBtn.addEventListener('click', () => {
                if (isRecording) {
                    stopAll();
                } else {
                    startAll();
                }
            });

            // Clear Session
            clearBtn.addEventListener('click', () => {
                if (isRecording) stopAll();
                finalTranscript = '';
                finalTextContainer.textContent = '';
                interimTextContainer.textContent = '';
                placeholderText.style.display = 'flex';
                audioPlayerContainer.classList.add('hidden');
                audioChunks = [];
            });
        });
    </script>
</body>
</html>
